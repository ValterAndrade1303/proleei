<html lang="pt-BR">

<title>Painel ProLEEI · Perfil dos Participantes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{--ink:#1e3a5f;--blue:#2563eb;--teal:#0d9488;--amber:#f59e0b;--pink:#ec4899;--red:#ef4444;--bg:#f6f8fb;--card:#fff;--muted:#64748b;--line:#e2e8f0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:#0f172a}
.layout{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--ink);color:#fff;position:fixed;top:0;bottom:0;left:0;z-index:50;display:flex;flex-direction:column;transition:transform .3s}
.sidebar .brand{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
.sidebar .brand h1{font-size:17px;font-weight:800;line-height:1.25}
.sidebar .brand p{font-size:11px;opacity:.75;margin-top:4px}
.nav{flex:1;padding:10px 0;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 18px;background:none;border:none;color:#cbd5e1;font:inherit;font-size:13.5px;cursor:pointer;text-align:left;border-left:3px solid transparent;transition:all .25s}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:rgba(37,99,235,.25);color:#fff;border-left-color:var(--blue);font-weight:600}
.nav .ico{width:20px;text-align:center}
.main{flex:1;margin-left:230px;padding:20px 26px 60px}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.topbar h2{font-size:20px;font-weight:800;color:var(--ink);margin-right:auto}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);transition:all .2s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.filters{display:flex;flex-wrap:wrap;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.filters label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-right:2px;align-self:center}
.filters select{font:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#f8fafc;color:var(--ink);cursor:pointer}
.page{display:none;animation:fadein .5s ease}
.page.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 1px 4px rgba(15,23,42,.05)}
.kpi .v{font-size:26px;font-weight:800;color:var(--ink)}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 1px 4px rgba(15,23,42,.05);margin-bottom:14px}
.card h3{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:2px}
.card .sub{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.card .head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tgl{display:flex;gap:4px}
.tgl button{border:1px solid var(--line);background:#fff;font:inherit;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:7px;cursor:pointer;color:var(--muted)}
.tgl button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chartbox{position:relative;height:300px}
.chartbox.tall{height:420px}
.chartbox canvas{max-width:100%}
.tblwrap{display:none;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:9px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;background:#f1f5f9;color:var(--ink);font-weight:700;padding:8px 10px;text-align:left;border-bottom:2px solid var(--line)}
td{padding:7px 10px;border-bottom:1px solid var(--line)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.notice{background:#fffbeb;border:1px solid #fcd34d;color:#92400e;border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:12px}
.alert{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:12px 14px;font-size:12.5px}
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.insight{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:12px;padding:14px 16px}
.insight.warn{border-left-color:var(--red)}.insight.good{border-left-color:var(--teal)}
.insight .n{font-size:11px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.5px}
.insight.warn .n{color:var(--red)}.insight.good .n{color:var(--teal)}
.insight h4{font-size:13.5px;margin:4px 0 6px;color:var(--ink)}
.insight p{font-size:12.5px;color:#334155;line-height:1.55}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.readout .card{margin:0}
.readout .card p{font-size:12.5px;color:#334155;line-height:1.5;margin-top:4px}
.readout .card strong{color:var(--ink)}
.search{width:100%;max-width:340px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13px;margin-bottom:10px}
footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.badge{display:inline-block;background:#fee2e2;color:#991b1b;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:6px}
.menu-btn{display:none;position:fixed;top:12px;left:12px;z-index:60;background:var(--ink);color:#fff;border:none;border-radius:9px;padding:9px 12px;font-size:16px;cursor:pointer}
@media(max-width:900px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}.main{margin-left:0;padding:64px 14px 50px}.menu-btn{display:block}}
@media print{.sidebar,.filters,.menu-btn,.tgl,.btn{display:none!important}.main{margin:0}.page{display:block!important;page-break-after:always}}
</style>
</head>

function buildFilters(){
 const f=[["pub","Público",["Cursistas","Formadores Municipais","Formadores Estaduais"]],

 if(sociodemActive()&&state.pub!=="Cursistas")h+=`<div class="notice">⚠️ Filtros sociodemográficos aplicam-se apenas ao público <strong>Cursistas</strong>. Troque o filtro de Público para ver o recorte.</div>`;
 else if(sociodemActive())h+=`<div class="notice">🔎 Filtros ativos: ${Object.entries(state).filter(([k,v])=>v&&k!=='pub').map(([k,v])=>`<strong>${v}</strong>`).join(' · ')} — os gráficos compatíveis com o recorte foram recalculados; os demais exibem o dado agregado.</div>`;
 b.innerHTML=h;
}

 charts[id]=new Chart(el,cfg);
}

 onClick:opts.filterKey?((e,els)=>{if(!els.length)return;state[opts.filterKey]=labels[els[0].index];buildFilters();renderAll();}):undefined,
 animation:animOn?{duration:900,easing:'easeOutQuart'}:false}};}
function doughCfg(labels,vals){return{type:'doughnut',data:{labels,datasets:[{data:vals,backgroundColor:PAL,borderWidth:2,borderColor:'#fff'}]},

function card(id,title,sub,inner,tall){return `<div class="card"><div class="head"><div><h3>${title}</h3><div class="sub">${sub}</div></div><div class="tgl"><button class="on" onclick="tg(this,'${id}',1)">Gráfico</button><button onclick="tg(this,'${id}',0)">Tabela</button></div></div><div class="chartbox${tall?' tall':''}">${inner}</div><div class="tblwrap" id="tbl_${id}"></div></div>`;}
function tg(btn,id,mode){const c=btn.parentElement.parentElement;[...btn.parentElement.children].forEach(b=>b.classList.remove('on'));btn.classList.add('on');
 c.querySelector('.chartbox').style.display=mode?'block':'none';c.querySelector('.tblwrap').style.display=mode?'none':'block';}

/* ================= KPIs ANIMADOS ================= */
function animNum(el,target,suffix=''){const start=performance.now(),dur=animOn?900:0;
 function step(t){const p=dur?Math.min((t-start)/dur,1):1,e=1-Math.pow(1-p,4);el.textContent=fmt(Math.round(target*e))+suffix;if(p<1)requestAnimationFrame(step);}
 requestAnimationFrame(step);}
